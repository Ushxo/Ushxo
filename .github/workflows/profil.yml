name: profil

on:
  schedule:
    - cron: "17 8 * * *" # chaque nuit, vers 3 h à Montréal
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profil
  cancel-in-progress: true

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Serpent
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpent-sombre.svg?color_snake=#f5c2e7&color_dots=#11111b,#3b2f52,#6c4f99,#9a7ad0,#cba6f7
            dist/serpent-clair.svg?color_snake=#ea76cb&color_dots=#e6e9ef,#d6c4f5,#b591ee,#9466e3,#8839ef

      - name: Graphe 3D
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: config/3d.json

      - name: Cartes de statistiques
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          LANGUES_EXCLUES: HTML,CSS,PLpgSQL,Shell,PowerShell,Batchfile,GDShader
        run: |
          node scripts/cartes.mjs "${{ github.repository_owner }}" dist
          cp profile-3d-contrib/*.svg dist/

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Mise à jour des animations du profil"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
