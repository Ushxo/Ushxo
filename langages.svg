<svg xmlns="http://www.w3.org/2000/svg" width="420" height="210" viewBox="0 0 420 210" role="img" aria-label="Langages les plus utilisés par Ushxo">
<title>Langages les plus utilisés par Ushxo</title>
<defs>
  <linearGradient id="bord" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#cba6f7"/><stop offset=".5" stop-color="#313244"/><stop offset="1" stop-color="#89b4fa"/>
  </linearGradient>
</defs>
<style>
  text{font-family:'JetBrainsMono Nerd Font','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .fade{animation:fade .6s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .respire{animation:respire 4s ease-in-out infinite}
  @keyframes respire{0%,100%{opacity:.35}50%{opacity:1}}
</style>
<rect x=".5" y=".5" width="419" height="209" rx="12" fill="#000000" stroke="#313244"/>
<rect class="respire" x=".5" y=".5" width="419" height="209" rx="12" fill="none" stroke="url(#bord)" stroke-width="1.2"/>
<text x="24" y="36" font-size="15" font-weight="700"><tspan fill="#cba6f7">❯</tspan><tspan fill="#89b4fa" dx="8">~/</tspan><tspan fill="#cdd6f4">langages</tspan></text>
<style>@keyframes pousse{from{transform:scaleX(0)}}</style>
<g class="fade" style="animation-delay:0.1s">
  <text x="24" y="70" font-size="12.5" fill="#cdd6f4">TypeScript</text>
  <rect x="128" y="60" width="230" height="10" rx="5" fill="#11111b"/>
  <rect x="128" y="60" width="230.0" height="10" rx="5" fill="#cba6f7" style="transform-origin:128px 0;animation:pousse 1s 0.30s cubic-bezier(.2,.8,.2,1) both"/>
  <text x="396" y="70" font-size="11.5" fill="#a6adc8" text-anchor="end">46.0%</text>
</g>
<g class="fade" style="animation-delay:0.2s">
  <text x="24" y="93" font-size="12.5" fill="#cdd6f4">GDScript</text>
  <rect x="128" y="83" width="230" height="10" rx="5" fill="#11111b"/>
  <rect x="128" y="83" width="165.8" height="10" rx="5" fill="#f5c2e7" style="transform-origin:128px 0;animation:pousse 1s 0.40s cubic-bezier(.2,.8,.2,1) both"/>
  <text x="396" y="93" font-size="11.5" fill="#a6adc8" text-anchor="end">33.2%</text>
</g>
<g class="fade" style="animation-delay:0.30000000000000004s">
  <text x="24" y="116" font-size="12.5" fill="#cdd6f4">Swift</text>
  <rect x="128" y="106" width="230" height="10" rx="5" fill="#11111b"/>
  <rect x="128" y="106" width="40.9" height="10" rx="5" fill="#89b4fa" style="transform-origin:128px 0;animation:pousse 1s 0.50s cubic-bezier(.2,.8,.2,1) both"/>
  <text x="396" y="116" font-size="11.5" fill="#a6adc8" text-anchor="end">8.2%</text>
</g>
<g class="fade" style="animation-delay:0.4s">
  <text x="24" y="139" font-size="12.5" fill="#cdd6f4">JavaScript</text>
  <rect x="128" y="129" width="230" height="10" rx="5" fill="#11111b"/>
  <rect x="128" y="129" width="34.2" height="10" rx="5" fill="#94e2d5" style="transform-origin:128px 0;animation:pousse 1s 0.60s cubic-bezier(.2,.8,.2,1) both"/>
  <text x="396" y="139" font-size="11.5" fill="#a6adc8" text-anchor="end">6.8%</text>
</g>
<g class="fade" style="animation-delay:0.5s">
  <text x="24" y="162" font-size="12.5" fill="#cdd6f4">Python</text>
  <rect x="128" y="152" width="230" height="10" rx="5" fill="#11111b"/>
  <rect x="128" y="152" width="16.1" height="10" rx="5" fill="#fab387" style="transform-origin:128px 0;animation:pousse 1s 0.70s cubic-bezier(.2,.8,.2,1) both"/>
  <text x="396" y="162" font-size="11.5" fill="#a6adc8" text-anchor="end">3.2%</text>
</g>
<g class="fade" style="animation-delay:0.6s">
  <text x="24" y="185" font-size="12.5" fill="#cdd6f4">Java</text>
  <rect x="128" y="175" width="230" height="10" rx="5" fill="#11111b"/>
  <rect x="128" y="175" width="6.6" height="10" rx="5" fill="#f9e2af" style="transform-origin:128px 0;animation:pousse 1s 0.80s cubic-bezier(.2,.8,.2,1) both"/>
  <text x="396" y="185" font-size="11.5" fill="#a6adc8" text-anchor="end">1.3%</text>
</g>
</svg>
